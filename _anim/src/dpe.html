<!doctype html>
<html><head><meta charset="utf-8">
<title>DPE teaser</title>
<link rel="stylesheet" href="../lib/base.css">
<script src="../lib/gsap.min.js"></script>
<script src="../lib/stage.js"></script>
<style>
  /* stream card, top right (the venue badge owns the top-left corner) */
  #card { left: 206px; top: 10px; width: 258px; height: 42px; }
  #card .mark { position: absolute; left: 10px; top: 11px; width: 20px; height: 20px; border-radius: 6px;
                background: var(--ink); color: var(--bg); display: grid; place-items: center; }
  #card .lab { position: absolute; left: 40px; top: 8px; }
  #card .val { position: absolute; left: 40px; top: 20px; font: 700 14px/16px "Space Grotesk"; color: var(--ink); }

  /* the unlabeled test stream: a conveyor that steps one image at a time */
  #track { position: absolute; left: 0; top: 60px; width: 480px; height: 44px; background: var(--panel-2);
           border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #strip { position: absolute; left: 0; top: 60px; height: 44px; width: 1200px; }
  .si { position: absolute; top: 4px; width: 36px; height: 36px; border-radius: 4px; overflow: hidden; }
  .si img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .si.ph { border: 1.5px dashed var(--line); background: var(--panel); }
  #gate { position: absolute; top: 61px; width: 42px; height: 42px; border-radius: 6px; border: 2px solid var(--acc); }

  .fly { position: absolute; object-fit: cover; border-radius: 4px; }

  /* per-class priority queues -> visual prototype (gold) <-> textual prototype (blue) */
  #qp { left: 16px; top: 112px; width: 290px; height: 144px; }
  .slot { position: absolute; width: 36px; height: 36px; border-radius: 4px; border: 1.5px dashed var(--line); background: var(--panel-2); }
  .meter { position: absolute; width: 36px; height: 3px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--good); transform-origin: 0 50%; border-radius: 2px; }
  .qarrow { position: absolute; color: var(--gold); }
  .vp { position: absolute; width: 20px; height: 20px; border-radius: 5px; border: 1.5px dashed var(--gold); }
  .vp i { position: absolute; inset: -1.5px; border-radius: 5px; background: var(--gold); }
  .link { position: absolute; height: 0; border-top: 1.5px dashed var(--ink-faint); }
  .tp { height: 22px; padding: 0 8px; font-size: 12px; background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }

  /* right column */
  .who { position: absolute; left: 322px; font: 600 9.5px/1 Inter; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
  .who.us { color: var(--acc); }
  .ans { left: 320px; height: 25px; font-size: 12px; }
  #cur { left: 348px; top: 116px; width: 84px; height: 84px; }
  #curMeter { left: 348px; top: 208px; width: 84px; height: 6px; }
  #curMeter .fill { width: 100%; background: var(--good); }
  #conf { top: 222px; }
  #weak { left: 110px; top: 120px; width: 40px; height: 46px; border-radius: 6px; }

  /* result */
  #res { left: 16px; top: 113px; width: 448px; height: 140px; }
  .rname { position: absolute; left: 16px; width: 80px; font: 600 12.5px/22px Inter; color: var(--ink-soft); white-space: nowrap; }
  .rtrack { position: absolute; left: 70px; height: 22px; width: 250px; border-radius: 5px; background: var(--panel-2); }
  .rbar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transform-origin: 0 50%; }
  .rval { position: absolute; font: 700 17px/22px "Space Grotesk"; }
  #gain { height: 22px; font-size: 12px; }

  .cap-half { display: inline-block; }
</style>
</head>
<body>
<div id="stage"><div id="scene">

  <div class="panel" id="card">
    <div class="mark"><i data-i="arrow" data-s="12" data-w="2.2"></i></div>
    <div class="label lab">Test time · no labels</div>
    <div class="val">test image #<span id="cnt">1</span></div>
  </div>

  <div id="track"></div>
  <div id="strip"></div>
  <div id="gate"></div>

  <div class="panel" id="qp"></div>

  <div class="who" id="whoA" style="top:126px">TPT</div>
  <div class="chip ans no" id="aA" style="top:139px">resets per image <i data-i="cross" data-s="12" data-w="2.4"></i></div>
  <div class="who us" id="whoB" style="top:178px">DPE</div>
  <div class="chip ans ok" id="aB" style="top:191px">accumulates <i data-i="check" data-s="13" data-w="2.4"></i></div>

  <div id="layer"></div>
  <div class="box no" id="weak"></div>

  <div class="img" id="cur"></div>
  <div class="track" id="curMeter"><div class="fill" id="curFill"></div></div>
  <div class="chip ok" id="conf">confident <i data-i="check" data-s="13" data-w="2.4"></i></div>

  <div class="panel" id="res">
    <div class="label abs" style="left:16px;top:16px">Cross-dataset · avg of 10 datasets</div>
    <div class="label abs" style="right:16px;top:16px">CLIP ViT-B/16</div>
    <div class="rname" style="top:40px">TPT</div>
    <div class="rtrack" style="top:40px"><div class="rbar" id="r0" style="background:var(--base)"></div></div>
    <div class="rval soft" id="v0">65.10</div>
    <div class="rname" style="top:74px">TDA</div>
    <div class="rtrack" style="top:74px"><div class="rbar" id="r1" style="background:var(--base)"></div></div>
    <div class="rval soft" id="v1">67.53</div>
    <div class="rname" style="top:108px;color:var(--acc)">DPE</div>
    <div class="rtrack" style="top:108px"><div class="rbar" id="r2" style="background:var(--acc)"></div></div>
    <div class="rval hl" id="v2">69.40</div>
    <div class="chip acc" id="gain">+4.30 vs TPT</div>
  </div>

  <div class="caption" id="cap">
    <span class="cap-half" id="ch1"><span class="blue">text</span> &amp; <span class="gold">image</span> prototypes</span>
    <span class="cap-half" id="ch2">evolve at test time</span>
  </div>
</div></div>

<script>
var A = '../assets/dpe/';
// the stream: Fig. 2 "High-Confidence Samples" (queued per pseudo-label) + the Fig. 1/2 test image
var STREAM = [
  { f: 'queue_dog_beagle_face',    row: 0, slot: 0, conf: 0.90 },
  { f: 'queue_cat_fluffy',         row: 1, slot: 0, conf: 0.85 },
  { f: 'queue_car_blue_suv',       row: 2, slot: 0, conf: 0.92 },
  { f: 'queue_dog_beagle_grass',   row: 0, slot: 1, conf: 0.78 },
  { f: 'queue_car_yellow_sports',  row: 2, slot: 1, conf: 0.82 },
  { f: 'queue_cat_box',            row: 1, slot: 1, conf: 0.72 },
  { f: 'queue_car_black_sedan',    row: 2, slot: 2, conf: 0.66 },
  { f: 'queue_dog_beagle_sitting', row: 0, slot: 2, conf: 0.42 },   // least confident dog
  { f: 'test_basset_hound',        row: 0, slot: 2, conf: 0.95 }    // replaces it
];
var CLS = ['dog', 'cat', 'car'];
var G = 232, P = 44;                       // gate x, conveyor pitch
var ROWY = [122, 166, 210];                // stage y of each queue row
var SLOTX = [28, 70, 112];                 // stage x of the 3 slots (M = 3)
var VX = 180, T0X = 240, T1X = 212;        // visual prototype x, text prototype x before / after alignment

var strip = document.getElementById('strip');
for (var i = 0; i < 15; i++) {
  var d = document.createElement('div');
  d.className = 'si' + (i < STREAM.length ? '' : ' ph'); d.id = 'si' + i;
  d.style.left = (G + 3 + P * i) + 'px';
  if (i < STREAM.length) d.innerHTML = '<img src="' + A + STREAM[i].f + '.jpg">';
  strip.appendChild(d);
}
document.getElementById('gate').style.left = G + 'px';
document.getElementById('cur').innerHTML = '<img src="' + A + 'test_basset_hound.jpg">';

// queue rows live on the stage (not inside the panel) so the maths stays in stage px
var layer = document.getElementById('layer'), html = '';
ROWY.forEach(function (y, r) {
  SLOTX.forEach(function (x, s) {
    html += '<div class="slot" id="sl' + r + s + '" style="left:' + x + 'px;top:' + y + 'px"></div>';
    html += '<div class="meter" id="me' + r + s + '" style="left:' + x + 'px;top:' + (y + 40) + 'px"><i></i></div>';
  });
  html += '<div class="qarrow" style="left:154px;top:' + (y + 11) + 'px"><i data-i="arrow" data-s="14" data-w="2"></i></div>';
  html += '<div class="vp" id="vp' + r + '" style="left:' + VX + 'px;top:' + (y + 8) + 'px"><i></i></div>';
  html += '<div class="link" id="ln' + r + '" style="left:' + (VX + 22) + 'px;top:' + (y + 18) + 'px;width:' + (T0X - VX - 24) + 'px"></div>';
  html += '<div class="chip tp" id="tp' + r + '" style="left:' + T0X + 'px;top:' + (y + 7) + 'px">' + CLS[r] + '</div>';
});
STREAM.forEach(function (it, k) {
  html += '<img class="fly" id="fl' + k + '" src="' + A + it.f + '.jpg">';
});
layer.innerHTML = html;

Stage.build(function (o) {
  var tl = o.tl;
  var PICK = [];                                    // when item k leaves the gate
  for (var k = 0; k < 8; k++) PICK.push(0.95 + 0.24 * k);
  var B2 = 4.0;
  PICK.push(B2 + 0.25);                             // the basset

  // conveyor: one pitch per step, just before each pick
  for (var k = 1; k < STREAM.length; k++) {
    tl.fromTo(strip, { x: -P * (k - 1) }, { x: -P * k, duration: 0.24, ease: 'power2.inOut', immediateRender: false }, PICK[k] - 0.26);
  }
  o.at(function (t) {
    var n = 1;
    for (var k = 1; k < STREAM.length; k++) if (t >= PICK[k] - 0.14) n = k + 1;
    var el = document.getElementById('cnt'), s = String(n);
    if (el.textContent !== s) el.textContent = s;
  });

  tl.from('#card', { opacity: 0, y: -6 }, 0.3);
  tl.from(['#track', '#strip'], { opacity: 0 }, 0.3);
  tl.fromTo('#gate', { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 0.6);
  tl.from(['#qp', '#layer'], { opacity: 0, y: 6 }, 0.45);
  tl.fromTo('#cap .cap-half', { opacity: 0 }, { opacity: 0.32, duration: 0.4 }, 0.4);
  tl.set('.meter i', { scaleX: 0 }, 0);
  tl.set('.vp i', { opacity: 0, scale: 0.4 }, 0);
  tl.set('.fly', { opacity: 0 }, 0);

  // ---- beat 1: confident test images fill each class's queue -----------------------
  tl.to('#ch1', { opacity: 1, duration: 0.4 }, 1.0);
  var filled = [0, 0, 0];
  for (var k = 0; k < 8; k++) {
    var it = STREAM[k], t0 = PICK[k], x0 = G + 3, y0 = 64, x1 = SLOTX[it.slot], y1 = ROWY[it.row];
    tl.set('#fl' + k, { left: x0, top: y0, width: 36, height: 36, opacity: 1 }, t0);
    tl.set('#si' + k, { opacity: 0.22 }, t0);
    tl.to('#fl' + k, { left: x1, top: y1, duration: 0.5, ease: 'power3.inOut' }, t0);
    tl.to('#me' + it.row + it.slot + ' i', { scaleX: it.conf, duration: 0.35 }, t0 + 0.45);
    if (filled[it.row]++ === 0) {
      tl.to('#vp' + it.row + ' i', { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.2)' }, t0 + 0.45);
    } else {
      tl.fromTo('#vp' + it.row + ' i', { scale: 1.3 }, { scale: 1, duration: 0.4, immediateRender: false }, t0 + 0.45);
    }
    tl.fromTo('#tp' + it.row, { scale: 1.12 }, { scale: 1, duration: 0.4, immediateRender: false }, t0 + 0.5);
  }
  tl.from('#whoA', { opacity: 0, x: -6 }, 1.25);
  tl.fromTo('#aA', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 1.35);
  tl.from('#whoB', { opacity: 0, x: -6 }, 2.35);
  tl.fromTo('#aB', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 2.45);

  // ---- beat 2: a more confident image replaces the weakest; prototypes evolve -------
  tl.to(['#whoA', '#aA', '#whoB', '#aB'], { opacity: 0, duration: 0.3 }, B2);
  tl.to('#ch2', { opacity: 1, duration: 0.4 }, B2 + 0.1);
  var tb = PICK[8];
  tl.set('#si8', { opacity: 0.22 }, tb);
  tl.fromTo('#cur', { left: G + 3, top: 64, width: 36, height: 36, opacity: 0 },
    { left: 348, top: 116, width: 84, height: 84, opacity: 1, duration: 0.5, ease: 'power3.inOut' }, tb);
  tl.from('#curMeter', { opacity: 0 }, tb + 0.4);
  tl.fromTo('#curFill', { scaleX: 0 }, { scaleX: 0.95, duration: 0.4 }, tb + 0.5);
  tl.fromTo('#conf', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, tb + 0.7);
  tl.set('#conf', { left: 390 - 46 }, 0);
  // the least confident dog is pushed out of the full queue
  tl.set('#me02 i', { backgroundColor: 'var(--bad)' }, tb + 1.0);
  tl.fromTo('#weak', { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, tb + 1.0);
  tl.to(['#fl7', '#weak'], { y: 14, opacity: 0, duration: 0.4, ease: 'power2.in' }, tb + 1.35);
  tl.to('#me02 i', { scaleX: 0, duration: 0.25 }, tb + 1.35);
  // the basset takes its place
  tl.to('#cur', { left: SLOTX[2], top: ROWY[0], width: 36, height: 36, duration: 0.55, ease: 'power3.inOut' }, tb + 1.4);
  tl.to(['#curMeter', '#conf'], { opacity: 0, duration: 0.25 }, tb + 1.4);
  tl.set('#me02 i', { backgroundColor: 'var(--good)' }, tb + 1.65);
  tl.to('#me02 i', { scaleX: 0.95, duration: 0.35 }, tb + 1.9);
  tl.fromTo('#vp0 i', { scale: 1.35 }, { scale: 1, duration: 0.45, immediateRender: false }, tb + 1.9);
  tl.fromTo('#tp0', { scale: 1.15 }, { scale: 1, duration: 0.45, immediateRender: false }, tb + 1.95);
  // text and image prototypes are pulled into alignment
  var AL = tb + 2.1;
  [0, 1, 2].forEach(function (r) {
    tl.to('#tp' + r, { left: T1X, duration: 0.6, ease: 'power3.inOut' }, AL + 0.06 * r);
    tl.to('#ln' + r, { width: T1X - VX - 24, duration: 0.6, ease: 'power3.inOut' }, AL + 0.06 * r);
  });
  // back to the contrast: TPT starts over, DPE has kept (and improved) what it saw
  tl.to(['#whoA', '#aA'], { opacity: 1, duration: 0.35 }, AL + 0.25);
  tl.to(['#whoB', '#aB'], { opacity: 1, duration: 0.35 }, AL + 0.4);

  // ---- beat 3: the number ----------------------------------------------------------
  var RES = 7.85;
  tl.to(['#qp', '#layer', '#cur', '#gate', '#whoA', '#aA', '#whoB', '#aB'], { opacity: 0, duration: 0.35 }, RES);
  tl.fromTo('#res', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, RES + 0.25);
  var VALS = [65.10, 67.53, 69.40], PX = 2.5;      // track = 0..100 %
  VALS.forEach(function (v, i) {
    var t0 = RES + 0.45 + 0.25 * i, w = v * PX;
    tl.set('#r' + i, { width: w }, 0);
    tl.set('#v' + i, { left: 70 + w + 8, top: 40 + 34 * i }, 0);
    tl.fromTo('#r' + i, { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: 'power2.out' }, t0);
    o.count('#v' + i, 0, v, t0, 0.65, { decimals: 2 });
    tl.fromTo('#v' + i, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t0);
  });
  tl.set('#gain', { left: 70 + 69.40 * PX + 64, top: 108 }, 0);
  tl.fromTo('#gain', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, RES + 1.45);
}, { duration: 10.5, poster: 5.55 });
</script>
</body></html>
