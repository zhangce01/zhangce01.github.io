  - title: "RSIGame: Autonomous Agentic Game Development with Recursive Self-improvement"
    year: 2026
    authors: Wenyi Wu<sup>*</sup>, Minghao Fu<sup>*</sup>, Jieyu You, Kun Zhou, Siqi Liu, Aayush Salvi, Yiheng Lin, <strong>Ce Zhang</strong>, Xiaohan Lan, Jiahui Zhu, Yujie Zhong, Qi She, Biwei Huang <span class="eq-contrib">(<sup>*</sup>Equal contribution)</span>
    conference_short: Preprint
    conference: arXiv preprint arXiv:2609.39045, 2026.
    code: https://github.com/WenyiWU0111/RSIGame
    website: https://huggingface.co/spaces/RSIGame/rsigame-page
    badge: https://img.shields.io/github/stars/WenyiWU0111/RSIGame?style=social&label=Code+Stars
    teaser: rsigame
    teaser_alt: "RSIGame: the generated Lawn Guardians build is playable but scores 61.7 with placeholder art, and naive Play2Code refinement peaks at 81.5 then falls back to 65.7; RSIGame's explore-diagnose-improve loop fills an evolving checklist (46 images barely drawn, 'actions did not register'), wires in sprites and hit feedback, and holds the best build R12 at 86.1 through later dips; with experience internalized, Qwen3.8-27B reaches 61.38 on Godot and 58.53 on Phaser, above GPT-5.5 one-shot (50.26 / 49.44), with 11x fewer generation tokens on Godot"
    pdf: https://arxiv.org/pdf/2609.39045
    abstract: |
      Recent advances in large language models have made automatic game generation increasingly feasible, yet reliably improving generated games beyond a playable version remains challenging. Naive iterative refinement can easily overfit a small set of test cases, producing fragile games with unresolved bugs, missing behaviors, and poor generalization to broader player interactions. We introduce RSIGame, an autonomous agentic game development framework with recursive self-improvement. RSIGame organizes development into complementary local and global loops. Concretely, a local explore-diagnose-improve loop broadly explores the executable game, diagnoses and prioritizes discovered issues, and performs evidence-grounded revision, where an evolving checklist continually accumulates new testing and improvement guidance. A global loop tracks overall quality, preserves the best checkpoint, and detects saturation or regression over long-horizon development. Beyond test-time improvement, RSIGame further internalizes successful development experience into the generator through training. Across 140 GameCraft-Bench tasks, two game engines, and five generators, RSIGame consistently improves game quality under matched development budgets. Notably, experience internalization enables Qwen3.8-27B to reach 61.38 on Godot and 58.53 on Phaser, exceeding GPT-5.5 one-shot scores while reducing Qwen's generation tokens by 11 times.
    bibtex: |
      @article{wu2026rsigame,
          title     = {RSIGame: Autonomous Agentic Game Development with Recursive Self-improvement},
          author    = {Wu, Wenyi and Fu, Minghao and You, Jieyu and Zhou, Kun and Liu, Siqi and Salvi, Aayush and Lin, Yiheng and Zhang, Ce and Lan, Xiaohan and Zhu, Jiahui and Zhong, Yujie and She, Qi and Huang, Biwei},
          journal   = {arXiv preprint arXiv:2609.39045},
          year      = {2026}
      }

  - title: "Video2Skill: From Streaming Experience to Reusable Embodied Skills"
    year: 2026
    authors: Jianshu Zhang<sup>*</sup>, <strong>Ce Zhang<sup>*</sup></strong>, Xiyuan Yang, Chenwei Xu, Haoran Lu, Yijiang Li, Yaqi Xie, Katia Sycara, Han Liu <span class="eq-contrib">(<sup>*</sup>Equal contribution)</span>
    conference_short: Preprint
    conference: arXiv preprint arXiv:2609.36691, 2026.
    website: https://andyzworks.github.io/video2skill/
    teaser: video2skill
    teaser_alt: "Video2Skill: a VLM watches a stream of three manipulation videos, locating each event in time and maintaining a shared skill library: Video 1 creates grasp, transfer and place, Video 2 reuses all three despite new objects and scene, and Video 3 reuses grasp and transfer but creates throw for a new transformation; on 40 HD-EPIC clips, Qwen3.5-4B with oracle-history SFT ends with only 21–22 skills versus 46 reference classes, across all three video orders"
    pdf: https://arxiv.org/pdf/2609.36691
    abstract: |
      Manipulation behaviors vary widely across objects and scenes, but they share a small set of reusable skills, and planning with these skills helps embodied agents generalize to new tasks. Yet an agent can only plan with skills it knows. Recovering skills from observed experience, the inverse of planning, builds this knowledge over time and yields skill data for training future agents. Vision-Language Models (VLMs) describe individual manipulation events well, but can they organize a stream of events into reusable skills? We formulate this problem as Streaming Embodied Skill Discovery (SESD): a model watches videos in sequence and maintains a persistent skill library that shapes its later decisions. To systematically measure this ability, we introduce Video2Skill, a benchmark that covers robot tabletop manipulation and human kitchen activity and tests three core capabilities: (i) locating manipulation events in time, (ii) grouping events of the same transformation, and (iii) deciding when to reuse an existing skill or create a new one. Across 19 open-source VLMs, many models group events at near-chance level, and scale does not consistently help. Their errors depend on how perception and library updates are coupled: joint models merge distinct transformations into one skill, while models that update the library from text descriptions duplicate recurring ones. Supervised fine-tuning, including our counterfactual library-state rebalancing (CLaRe), improves grouping but exposes a deeper bottleneck: trained models consolidate familiar skills yet rarely expand the library. Their libraries stall below half the reference size, and transformations unseen in training are located in time but almost never given a new skill. Recognizing when existing skills are insufficient thus emerges as the central challenge.
    bibtex: |
      @article{zhang2026video2skill,
          title     = {Video2Skill: From Streaming Experience to Reusable Embodied Skills},
          author    = {Zhang, Jianshu and Zhang, Ce and Yang, Xiyuan and Xu, Chenwei and Lu, Haoran and Li, Yijiang and Xie, Yaqi and Sycara, Katia and Liu, Han},
          journal   = {arXiv preprint arXiv:2609.36691},
          year      = {2026}
      }

  - title: "StreamScout: Learning When to Look Deeper for Streaming Video Understanding"
    year: 2026
    authors: <strong>Ce Zhang</strong>, Jing Bi, Jinxi He, Jianshu Zhang, Jingyang Lin, Yunzhong Xiao, Minghao Fu, Yaqi Xie, Zhentao Xie, Weicong Chen, Katia Sycara, Ming Zhou
    conference_short: Preprint
    conference: arXiv preprint arXiv:2609.00291, 2026.
    teaser: streamscout
    teaser_alt: "StreamScout: a video stream is kept only as a text timeline; uniform sampling spends 64 frames (16,101 tokens) on every question, while StreamScout answers an easy question (what is the person holding right now?) after a glance at 4 recent frames and escalates a hard one (what price was on the tag shown earlier?) through a uniform look-back to query-salient retrieval of 24 frames before answering; on OVO-Bench with Qwen3-VL-8B, accuracy rises from 60.08 to 74.73 while tokens per question drop from 16,101 to 6,559 (-59%), answering in 1.04 s"
    pdf: https://arxiv.org/pdf/2609.00291
    abstract: |
      Streaming video understanding requires answering questions that arrive at arbitrary moments over an unbounded video stream. Existing systems primarily focus on what to retain in a bounded memory, yet access that memory using the same fixed-cost procedure for every query, despite substantial variation in the evidence required. We argue that deciding how deeply to access memory for each query is as important as deciding what the memory should store. To this end, we introduce StreamScout, an adaptive inference framework that maintains only a lightweight textual timeline in context as the stream unfolds. At query time, StreamScout progressively augments the timeline with up to three increasingly informative visual views: a glance at recent frames, a uniform look-back over the past stream, and query-salient retrieval. At each stage, the model answers immediately if the available evidence is sufficient; otherwise, it escalates to the next view. To improve this stop-or-escalate policy, we probe the cascade on an auxiliary set and distill the model's empirical competence boundary into supervision for a lightweight LoRA adaptation, yielding StreamScout-S. We further refine the policy through reinforcement learning, allowing the model to explore stopping behaviors beyond imitation of the distilled decisions, yielding StreamScout-R. Across three backbones and three streaming benchmarks, StreamScout and its variants consistently outperform prior streaming methods while substantially reducing inference cost and token consumption; on OVO-Bench, for instance, StreamScout-S improves Qwen3-VL-8B by 14.65 points while using 59% fewer tokens than uniform sampling and answering in 1.04 s on average.
    bibtex: |
      @article{zhang2026streamscout,
          title     = {StreamScout: Learning When to Look Deeper for Streaming Video Understanding},
          author    = {Zhang, Ce and Bi, Jing and He, Jinxi and Zhang, Jianshu and Lin, Jingyang and Xiao, Yunzhong and Fu, Minghao and Xie, Yaqi and Xie, Zhentao and Chen, Weicong and Sycara, Katia and Zhou, Ming},
          journal   = {arXiv preprint arXiv:2609.00291},
          year      = {2026}
      }

  - title: "LENS: Adaptive Spatio-Temporal Zooming for Keyframe Sampling in Long-Form Videos"
    year: 2026
    authors: <strong>Ce Zhang</strong>, Jinxi He, Katia Sycara, Yaqi Xie
    conference_short: ECCV 2026
    conference: European Conference on Computer Vision <strong>(ECCV)</strong>, 2026.
    place: Malmö, Sweden, September 8–12, 2026
    image: ./assets/img/ECCV26.webp
    image_w: 640
    image_h: 315
    teaser: lens
    teaser_alt: "LENS: for a detail question about what hangs on the walls, LENS zooms in by fogging everything but the wall and answers Mirrors where uniform sampling says Curtains; for a question about the whole video, it zooms out by packing four moments into one hyperframe and answers walking instead of dancing; Video-MME accuracy rises from 53.3 to 60.7"
    pdf: https://arxiv.org/pdf/2607.25125
    code: https://github.com/zhangce01/LENS
    website: https://zhangce01.github.io/LENS/
    badge: https://img.shields.io/github/stars/zhangce01/LENS?style=social&label=Code+Stars
    abstract: |
      Despite rapid progress in Multi-modal Large Language Models (MLLMs), understanding long-form videos is still bottlenecked by limited context windows. While recent keyframe sampling methods attempt to mitigate this by distilling video inputs into a compact set of query-relevant frames, navigating the vast spatio-temporal search space remains challenging, as spatial detail and temporal coverage often conflict. To address this, we introduce LENS, a training-free keyframe sampling framework that dynamically decides when to zoom in for fine-grained details and when to zoom out for broader context based on the text query. Concretely, LENS adaptively allocates a limited frame budget between spatial zoom-ins, which highlight query-relevant regions within individual frames, and temporal zoom-outs, which expand the temporal scope through multi-frame aggregation, enabling the model to reason across multiple granularities while capturing both high-fidelity details and long-range context. Across diverse long-form video benchmarks, LENS consistently outperforms prior state-of-the-art keyframe sampling methods and delivers substantial gains over uniform sampling, improving Video-MME accuracy from 53.3% to 60.7% with Qwen2.5-VL. Code is available at https://github.com/zhangce01/LENS.
    bibtex: |
      @inproceedings{zhang2026lens,
          title     = {LENS: Adaptive Spatio-Temporal Zooming for Keyframe Sampling in Long-Form Videos},
          author    = {Zhang, Ce and He, Jinxi and Sycara, Katia and Xie, Yaqi},
          booktitle = {European Conference on Computer Vision (ECCV)},
          year      = {2026}
      }

  - title: "WebAggregator: Enhancing Compositional Reasoning Capabilities of Deep Research Agent Foundation Models"
    year: 2026
    authors: Rui Wang, <strong>Ce Zhang</strong>, Jun-Yu Ma, Jianshu Zhang, Hongru Wang, Yi Chen, Boyang Xue, Tianqing Fang, Zhisong Zhang, Hongming Zhang, Haitao Mi, Dong Yu, Kam-Fai Wong
    conference_short: ACL 2026 (Main)
    conference: Annual Meeting of the Association for Computational Linguistics <strong>(ACL)</strong>, 2026.
    place: San Diego, CA, US, July 2-7, 2026
    code: https://github.com/Tencent/WebAggregator
    badge: https://img.shields.io/github/stars/Tencent/WebAggregator?style=social&label=Code+Stars
    image: ./assets/img/ACL26.webp
    image_w: 640
    image_h: 375
    teaser: webaggregator
    teaser_alt: "WebAggregator: a WebWalkerQA answer can be copied straight off a web page, while a WebAggregatorQA question needs filter, standard-deviation and sort steps over retrieved sets to reach 2604; fine-tuning on such tasks lifts Qwen3-32B on GAIA-text from 40.8 to 56.3"
    pdf: https://arxiv.org/pdf/2510.14438
    abstract: |
      Deep research web agents not only retrieve information from diverse sources such as web environments, files, and multimodal inputs, but more importantly, they need to rigorously analyze and aggregate knowledge for insightful research. However, existing open-source deep research agents predominantly focus on enhancing information-seeking capabilities of web agents to locate specific information, while overlooking the essential need for information aggregation, which would limit their ability to support in-depth research. We propose an Explore to Evolve paradigm to scalably construct verifiable training data for web agents. Begins with proactive online exploration, an agent sources grounded information by exploring the real web. Using the collected evidence, the agent then self-evolves an aggregation program by selecting, composing, and refining operations from 12 high-level logical types to synthesize a verifiable QA pair. This evolution from high-level guidance to concrete operations allowed us to scalably produce WebAggregatorQA, a dataset of 10K samples across 50K websites and 11 domains. Based on an open-source agent framework, SmolAgents, we collect supervised fine-tuning trajectories to develop a series of foundation models, WebAggregator. WebAggregator-8B matches the performance of GPT-4.1, while the 32B variant surpasses GPT-4.1 by more than 10% on GAIA-text and closely approaches Claude-3.7-sonnet. Moreover, given the limited availability of benchmarks that evaluate web agents' information aggregation abilities, we construct a human-annotated evaluation split of WebAggregatorQA as a challenging test set. On this benchmark, Claude-3.7-sonnet only achieves 28%, and GPT-4.1 scores 25.8%. Even when agents manage to retrieve all references, they still struggle on WebAggregatorQA, highlighting the need to strengthen the information aggregation capabilities of web agent foundations.
    bibtex: |
      @inproceedings{wang2026webaggregator,
          title     = {WebAggregator: Enhancing Compositional Reasoning Capabilities of Deep Research Agent Foundation Models},
          author    = {Rui Wang and Ce Zhang and Jun-Yu Ma and Jianshu Zhang and Hongru Wang and Yi Chen and Boyang Xue and Tianqing Fang and Zhisong Zhang and Hongming Zhang and Haitao Mi and Dong Yu and Kam-Fai Wong},
          booktitle = {Proceedings of the 64th Annual Meeting of the Association for Computational Linguistics},
          pages     = {24486--24517},
          year      = {2026}
      }

  - title: "Evolving Contextual Safety in Multi-Modal Large Language Models via Inference-Time Self-Reflective Memory"
    year: 2026
    authors: <strong>Ce Zhang<sup>*</sup></strong>, Jinxi He<sup>*</sup>, Junyi He, Katia Sycara, Yaqi Xie <span class="eq-contrib">(<sup>*</sup>Equal contribution)</span>
    conference_short: CVPR 2026
    conference: IEEE/CVF Conference on Computer Vision and Pattern Recognition <strong>(CVPR)</strong>, 2026.
    conference2: "ICLR 2026 Workshop on Lifelong Agents: Learning, Aligning, Evolving."
    place: Denver, CO, US, June 3-7, 2026
    code: https://github.com/EchoSafe-MLLM/EchoSafe
    website: https://echosafe-mllm.github.io/
    badge: https://img.shields.io/github/stars/EchoSafe-MLLM/EchoSafe?style=social&label=Code+Stars
    image: ./assets/img/echosafe1.webp
    image_w: 640
    image_h: 401
    teaser: echosafe
    teaser_alt: "EchoSafe: given the same query, it refuses beside a 'hack into someone's bank account' sign, stores a self-reflected safety insight in memory, retrieves it at the next step and correctly helps with 'Access my bank account Online'; MM-SafetyBench++ contextual correctness rises from 34.0 to 87.9 (AdaShield 71.1)"
    pdf: https://arxiv.org/pdf/2603.15800
    abstract: |
      Multi-modal Large Language Models (MLLMs) have achieved remarkable performance across a wide range of visual reasoning tasks, yet their vulnerability to safety risks remains a pressing concern. While prior research primarily focuses on jailbreak defenses that detect and refuse explicitly unsafe inputs, such approaches often overlook contextual safety, which requires models to distinguish subtle contextual differences between scenarios that may appear similar but diverge significantly in safety intent. In this work, we present MM-SafetyBench++, a carefully curated benchmark designed for contextual safety evaluation. Specifically, for each unsafe image-text pair, we construct a corresponding safe counterpart through minimal modifications that flip the user intent while preserving the underlying contextual meaning, enabling controlled evaluation of whether models can adapt their safety behaviors based on contextual understanding. Further, we introduce EchoSafe, a training-free framework that maintains a self-reflective memory bank to accumulate and retrieve safety insights from prior interactions. By integrating relevant past experiences into current prompts, EchoSafe enables context-aware reasoning and continual evolution of safety behavior during inference. Extensive experiments on various multi-modal safety benchmarks demonstrate that EchoSafe consistently achieves superior performance, establishing a strong baseline for advancing contextual safety in MLLMs.
    bibtex: |
      @inproceedings{zhang2026evolving,
          title     = {Evolving Contextual Safety in Multi-Modal Large Language Models via Inference-Time Self-Reflective Memory},
          author    = {Zhang, Ce and He, Jinxi and He, Junyi and Sycara, Katia and Xie, Yaqi},
          booktitle = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition},
          pages     = {41182--41192},
          year      = {2026}
      }

  - title: "pySpatial: Generating 3D Visual Programs for Zero-Shot Spatial Reasoning"
    year: 2026
    authors: Zhanpeng Luo<sup>*</sup>, <strong>Ce Zhang<sup>*</sup></strong>, Silong Yong, Cunxi Dai, Qianwei Wang, Haoxi Ran, Guanya Shi, Katia Sycara, Yaqi Xie <span class="eq-contrib">(<sup>*</sup>Equal contribution)</span>
    conference_short: ICLR 2026
    conference: International Conference on Learning Representations <strong>(ICLR)</strong>, 2026.
    place: Rio de Janeiro, Brazil, April 23-27, 2026
    code: https://github.com/Zhanpeng1202/pySpatial
    website: https://pyspatial.github.io/
    badge: https://img.shields.io/github/stars/Zhanpeng1202/pySpatial?style=social&label=Code+Stars
    image: ./assets/img/pyspatial.webp
    image_w: 640
    image_h: 339
    teaser: pyspatial
    teaser_alt: "pySpatial: asked what is left of the office chair from view 3, a 2D cognitive map answers Blue rubbish bin, while pySpatial writes a program that reconstructs the room in 3D, rotates the view-3 camera left and renders a novel view showing Sofa and table; MindCube accuracy rises from 45.62 to 58.56"
    abstract: |
      Multi-modal Large Language Models (MLLMs) have demonstrated strong capabilities in general-purpose perception and reasoning, but they still struggle with tasks that require spatial understanding of the 3D world. To address this, we introduce pySpatial, a visual programming framework that equips MLLMs with the ability to interface with spatial tools via Python code generation. Given an image sequence and a natural-language query, the model composes function calls to spatial tools including 3D reconstruction, camera-pose recovery, novel-view rendering, etc. These operations convert raw 2D inputs into an explorable 3D scene, enabling MLLMs to reason explicitly over structured spatial representations. Notably, pySpatial requires no gradient-based fine-tuning and operates in a fully zero-shot setting. Experimental evaluations on the challenging MindCube and Omni3D-Bench benchmarks demonstrate that our framework pySpatial consistently surpasses strong MLLM baselines; for instance, it outperforms GPT-4.1-mini by 12.94% on MindCube. Furthermore, we conduct real-world indoor navigation experiments where the robot can successfully traverse complex environments using route plans generated by pySpatial, highlighting the practical effectiveness of our approach.
    bibtex: |
      @inproceedings{luo2026pyspatial,
          title     = {pySpatial: Generating 3D Visual Programs for Zero-Shot Spatial Reasoning},
          author    = {Zhanpeng Luo and Ce Zhang and Silong Yong and Cunxi Dai and Qianwei Wang and Haoxi Ran and Guanya Shi and Katia P. Sycara and Yaqi Xie},
          booktitle = {The Fourteenth International Conference on Learning Representations},
          year      = {2026},
          url       = {https://openreview.net/forum?id=yv15C8ql24}
      }
    pdf: https://openreview.net/pdf?id=yv15C8ql24

  - title: "VScan: Rethinking Visual Token Reduction for Efficient Large Vision-Language Models"
    year: 2026
    authors: <strong>Ce Zhang</strong>, Kaixin Ma, Tianqing Fang, Wenhao Yu, Hongming Zhang, Zhisong Zhang, Haitao Mi, Dong Yu
    conference_short: TMLR 2026
    conference: Transactions on Machine Learning Research <strong>(TMLR)</strong>, 2026.
    conference2: ICML 2025 Workshop on Efficient Systems for Foundation Models (ES-FoMo III).
    code: https://github.com/Tencent/SelfEvolvingAgent/tree/main/VScan
    badge: https://img.shields.io/github/stars/Tencent/SelfEvolvingAgent?style=social&label=Code+Stars
    website: https://zhangce01.github.io/VScan/
    image: ./assets/img/vscan.webp
    image_w: 640
    image_h: 324
    teaser: vscan
    teaser_alt: "VScan: asked where the people in a beach photo are standing, text-agnostic and early-layer token pruning answer Ground and Street, while VScan's global + local scan and mid-LLM pruning answer Beach; LLaVA-NeXT-7B prefill drops from 1420 s to 488 s (2.91x) with 95.4% of performance kept"
    abstract: |
      Recent Large Vision-Language Models (LVLMs) have advanced multi-modal understanding by incorporating finer-grained visual perception and encoding. However, such methods incur significant computational costs due to longer visual token sequences, posing challenges for real-time deployment. To mitigate this, prior studies have explored pruning unimportant visual tokens either at the output layer of the visual encoder or at the early layers of the language model. In this work, we revisit these design choices and reassess their effectiveness through comprehensive empirical studies of how visual tokens are processed throughout the visual encoding and language decoding stages. Guided by these insights, we propose VScan, a two-stage visual token reduction framework that addresses token redundancy by: (1) integrating complementary global and local scans with token merging during visual encoding, and (2) introducing pruning at intermediate layers of the language model. Extensive experimental results across four LVLMs validate the effectiveness of VScan in accelerating inference and demonstrate its superior performance over current state-of-the-arts on sixteen benchmarks. Notably, when applied to LLaVA-NeXT-7B, VScan achieves a 2.91× speedup in prefilling and a 10× reduction in FLOPs, while retaining 95.4% of the original performance.
    bibtex: |
      @article{zhang2026vscan,
          title   = {{VS}can: Rethinking Visual Token Reduction for Efficient Large Vision-Language Models},
          author  = {Ce Zhang and Kaixin Ma and Tianqing Fang and Wenhao Yu and Hongming Zhang and Zhisong Zhang and Haitao Mi and Dong Yu},
          journal = {Transactions on Machine Learning Research},
          issn    = {2835-8856},
          year    = {2026},
          url     = {https://openreview.net/forum?id=KZYhyilFnt}
      }
    pdf: https://arxiv.org/pdf/2505.22654

  - title: "ONLY: One-Layer Intervention Sufficiently Mitigates Hallucinations in Large Vision-Language Models"
    year: 2025
    authors: Zifu Wan<sup>*</sup>, <strong>Ce Zhang<sup>*</sup></strong>, Silong Yong, Martin Ma, Simon Stepputtis, Louis-Philippe Morency, Deva Ramanan, Katia Sycara, Yaqi Xie <span class="eq-contrib">(<sup>*</sup>Equal contribution)</span>
    conference_short: ICCV 2025
    conference: IEEE/CVF International Conference on Computer Vision <strong>(ICCV)</strong>, 2025.
    place: Honolulu, HI, US, October 19–23, 2025
    code: https://github.com/zifuwan/ONLY
    badge: https://img.shields.io/github/stars/zifuwan/ONLY?style=social&label=Code+Stars
    website: https://zifuwan.github.io/ONLY/
    image: ./assets/img/iccv2025.webp
    image_w: 640
    image_h: 456
    teaser: only
    teaser_alt: "ONLY: regular decoding calls a black banana 'yellow'; re-running one layer with only its text-leaning heads exposes the language prior, and contrasting it gives 'black'; latency is 1.07x (3.70 s vs 3.47 s) versus about 2x for VCD and M3ID"
    abstract: |
      Recent Large Vision-Language Models (LVLMs) have introduced a new paradigm for understanding and reasoning about image input through textual responses. Although they have achieved remarkable performance across a range of multi-modal tasks, they face the persistent challenge of hallucination, which introduces practical weaknesses and raises concerns about their reliable deployment in real-world applications. Existing work has explored contrastive decoding approaches to mitigate this issue, where the output of the original LVLM is compared and contrasted with that of a perturbed version. However, these methods require two or more queries that slow down LVLM response generation, making them less suitable for real-time applications. To overcome this limitation, we propose ONLY, a training-free decoding approach that requires only a single query and a one-layer intervention during decoding, enabling efficient real-time deployment. Specifically, we enhance textual outputs by selectively amplifying crucial textual information using a text-to-visual entropy ratio for each token. Extensive experimental results demonstrate that our ONLY approach consistently outperforms state-of-the-art methods across various benchmarks while requiring minimal implementation effort and computational cost. Code is available at https://github.com/zifuwan/ONLY.
    bibtex: |
      @inproceedings{wan2025only,
          title     = {ONLY: One-Layer Intervention Sufficiently Mitigates Hallucinations in Large Vision-Language Models},
          author    = {Wan, Zifu and Zhang, Ce and Yong, Silong and Ma, Martin Q. and Stepputtis, Simon and Morency, Louis-Philippe and Ramanan, Deva and Sycara, Katia and Xie, Yaqi},
          booktitle = {Proceedings of the IEEE/CVF International Conference on Computer Vision},
          pages     = {3225--3234},
          year      = {2025}
      }
    pdf: https://arxiv.org/pdf/2507.00898

  - title: "Spectral-Aware Global Fusion for RGB-Thermal Semantic Segmentation"
    year: 2025
    authors: <strong>Ce Zhang</strong>, Zifu Wan, Simon Stepputtis, Katia Sycara, Yaqi Xie
    conference_short: ICIP 2025
    conference: International Conference on Image Processing <strong>(ICIP)</strong>, 2025.
    place: Anchorage, AK, US, September 14–17, 2025
    image: ./assets/img/icip2025.webp
    image_w: 640
    image_h: 543
    teaser: sgfnet
    teaser_alt: "SGFNet: high-pass RGB catches the bikes but misses the pedestrians, high-pass thermal does the reverse; spectral fusion segments both; MFNet mIoU 60.1 vs 58.9 (EAEFNet)"
    pdf: https://arxiv.org/pdf/2505.15491
    video: https://www.youtube.com/watch?v=tIHjgR4hsRA
    notes: Selected for a Lecture presentation.
    abstract: |
      Semantic segmentation relying solely on RGB data often struggles in challenging conditions such as low illumination and obscured views, limiting its reliability in critical applications like autonomous driving. To address this, integrating additional thermal radiation data with RGB images demonstrates enhanced performance and robustness. However, how to effectively reconcile the modality discrepancies and fuse the RGB and thermal features remains a well-known challenge. In this work, we address this challenge from a novel spectral perspective. We observe that the multi-modal features can be categorized into two spectral components: low-frequency features that provide broad scene context, including color variations and smooth areas, and high-frequency features that capture modality-specific details such as edges and textures. Inspired by this, we propose the Spectral-aware Global Fusion Network (SGFNet) to effectively enhance and fuse the multi-modal features by explicitly modeling the interactions between the high-frequency, modality-specific features. Our experimental results demonstrate that SGFNet outperforms the state-of-the-art methods on the MFNet and PST900 datasets.
    bibtex: |
      @inproceedings{zhang2025spectral,
          title     = {Spectral-Aware Global Fusion for RGB-Thermal Semantic Segmentation},
          author    = {Zhang, Ce and Wan, Zifu and Stepputtis, Simon and Sycara, Katia and Xie, Yaqi},
          booktitle = {IEEE International Conference on Image Processing (ICIP)},
          pages     = {43--48},
          publisher = {IEEE},
          year      = {2025}
      }

  - title: "InstructPart: Task-Oriented Part Segmentation with Instruction Reasoning"
    year: 2025
    authors: Zifu Wan, Yaqi Xie, <strong>Ce Zhang</strong>, Zhiqiu Lin, Zihan Wang, Simon Stepputtis, Deva Ramanan, Katia Sycara
    conference_short: ACL 2025 (Main)
    conference: Annual Meeting of the Association for Computational Linguistics <strong>(ACL)</strong>, 2025.
    conference2: "AAAI 2024 Workshop on Public Sector LLMs: Algorithmic and Sociotechnical Design."
    place: Vienna, Austria, July 27 - August 1, 2025
    code: https://github.com/zifuwan/InstructPart
    badge: https://img.shields.io/github/stars/zifuwan/InstructPart?style=social&label=Code+Stars
    website: https://zifuwan.github.io/InstructPart/
    image: ./assets/img/acl2025.webp
    image_w: 640
    image_h: 321
    teaser: instructpart
    teaser_alt: "InstructPart: asked 'Which part in the picture can be utilized to hold the kettle?', off-the-shelf models segment the toaster or the whole kettle while fine-tuned PISA segments just the handle; gIoU rises from 32.1 to 76.2"
    abstract: |
      Large multimodal foundation models, particularly in the domains of language and vision, have significantly advanced various tasks, including robotics, autonomous driving, information retrieval, and grounding. However, many of these models perceive objects as indivisible, overlooking the components that constitute them. Understanding these components and their associated affordances provides valuable insights into an object's functionality, which is fundamental for performing a wide range of tasks. In this work, we introduce a novel real-world benchmark, InstructPart, comprising hand-labeled part segmentation annotations and task-oriented instructions to evaluate the performance of current models in understanding and executing part-level tasks within everyday contexts. Through our experiments, we demonstrate that task-oriented part segmentation remains a challenging problem, even for state-of-the-art Vision-Language Models (VLMs). In addition to our benchmark, we introduce a simple baseline that achieves a twofold performance improvement through fine-tuning with our dataset. With our dataset and benchmark, we aim to facilitate research on task-oriented part segmentation and enhance the applicability of VLMs across various domains, including robotics, virtual reality, information retrieval, and other related fields.
    bibtex: |
