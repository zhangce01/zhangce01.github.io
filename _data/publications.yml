          title     = {Enhancing Vision-Language Few-Shot Adaptation with Negative Learning},
          booktitle = {IEEE/CVF Winter Conference on Applications of Computer Vision (WACV)},
          pages     = {5905--5915},
          publisher = {IEEE},
          year      = {2025},
          doi       = {10.1109/WACV61041.2025.00576}
      }
